name: CI

on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: ['claude/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1500M

jobs:
  linux-gcc:
    name: linux-gcc
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev \
            ninja-build ccache xvfb

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-linux-gcc-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-linux-gcc-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-gcc-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSAWBLADE_BUILD_PLUGIN=ON \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          SAWBLADE_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: ctest --test-dir build --output-on-failure

      - name: A2 CPU benchmark table
        run: |
          ctest --test-dir build -R '^a2_bench$' -V | tee a2_bench.log
          { echo '### A2 CPU benchmark (${{ github.job }})'; echo '```'; sed -n '/^[0-9]*: A2 CPU benchmark/,/Rig real-time check/p' a2_bench.log | sed 's/^[0-9]*: //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0_4-screenshots-linux-gcc
          path: screenshots
          if-no-files-found: warn

      - name: Download pluginval
        run: |
          curl -fsSL -o pluginval_Linux.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          echo "c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352  pluginval_Linux.zip" | sha256sum -c -
          unzip -o pluginval_Linux.zip -d pluginval
          chmod +x pluginval/pluginval

      - name: pluginval (VST3, level 10)
        env:
          SAWBLADE_NO_NETWORK: "1"
        run: |
          xvfb-run -a pluginval/pluginval --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 \
            --validate build/plugin/SawbladePlugin_artefacts/Release/VST3/Sawblade.vst3

      - name: ccache stats
        if: always()
        run: ccache -s

  linux-clang-werror:
    name: linux-clang-werror
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev \
            ninja-build ccache xvfb clang

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-linux-clang-werror-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-linux-clang-werror-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-linux-clang-werror-

      # -Werror comes from the sawblade_warnings target (our targets only); no global -Werror.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSAWBLADE_BUILD_PLUGIN=ON \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: A2 CPU benchmark table
        run: |
          ctest --test-dir build -R '^a2_bench$' -V | tee a2_bench.log
          { echo '### A2 CPU benchmark (${{ github.job }})'; echo '```'; sed -n '/^[0-9]*: A2 CPU benchmark/,/Rig real-time check/p' a2_bench.log | sed 's/^[0-9]*: //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: ccache stats
        if: always()
        run: ccache -s

  macos-arm64:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          for pkg in ninja ccache; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-macos-arm64-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-macos-arm64-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-macos-arm64-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSAWBLADE_BUILD_PLUGIN=ON \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          SAWBLADE_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: ctest --test-dir build --output-on-failure

      - name: A2 CPU benchmark table
        run: |
          ctest --test-dir build -R '^a2_bench$' -V | tee a2_bench.log
          { echo '### A2 CPU benchmark (${{ github.job }})'; echo '```'; sed -n '/^[0-9]*: A2 CPU benchmark/,/Rig real-time check/p' a2_bench.log | sed 's/^[0-9]*: //'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0_4-screenshots-macos-arm64
          path: screenshots
          if-no-files-found: warn

      - name: Install AU and run auval
        run: |
          set -eo pipefail
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/Sawblade.component"
          cp -R build/plugin/SawbladePlugin_artefacts/Release/AU/Sawblade.component \
            "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aufx Swb1 Swbl

      - name: Download pluginval
        run: |
          curl -fsSL -o pluginval_macOS.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval_macOS.zip" | shasum -a 256 -c -
          unzip -q -o pluginval_macOS.zip -d pluginval

      - name: pluginval (AU, level 10)
        env:
          SAWBLADE_NO_NETWORK: "1"
        run: |
          pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 \
            --validate "$HOME/Library/Audio/Plug-Ins/Components/Sawblade.component"

      - name: pluginval (VST3, level 10)
        env:
          SAWBLADE_NO_NETWORK: "1"
        run: |
          pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 \
            --validate build/plugin/SawbladePlugin_artefacts/Release/VST3/Sawblade.vst3

      - name: ccache stats
        if: always()
        run: ccache -s

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: match/pyproject.toml

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-python-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-python-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-python-

      - name: Install Python package
        run: |
          python -m venv match/.venv
          match/.venv/bin/pip install -e 'match[dev]'

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSAWBLADE_BUILD_PYTHON=ON -DSAWBLADE_BUILD_TESTS=OFF \
            -DPython_EXECUTABLE=$PWD/match/.venv/bin/python \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: pytest
        env:
          SAWBLADE_CORE_DIR: ${{ github.workspace }}/build/python
          SAWBLADE_TONERENDER: ${{ github.workspace }}/build/cli/tonerender
        run: match/.venv/bin/pytest match -rs

      # Committed level-match trims are fresh (no captures needed: presets that need TONE3000 captures are skipped). ~10 s.
      - name: compute_trims --check
        run: match/.venv/bin/python scripts/compute_trims.py --check --tonerender build/cli/tonerender

      - name: ccache stats
        if: always()
        run: ccache -s

  # The main `python` job installs only match[dev] (no trainer).  This job installs match[dev,export] with the pinned
  # trainer (neural-amp-modeler 0.13.0, CPU torch) and runs only what needs it: export / A2 tests, the A1 preset pins and
  # the A2 fixture generator check.  nam-dependent tests use pytest.importorskip("nam"), so they run here and skip there.
  python-export:
    name: python-export
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            match/pyproject.toml
            match/constraints-export.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-python-export-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-python-export-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-python-export-

      # CPU-only torch (torch 2.5.1 is pinned by constraints-export.txt; the CPU index avoids the multi-GB CUDA wheels).
      - name: Install Python package with the trainer
        run: |
          python -m venv match/.venv
          match/.venv/bin/pip install -e 'match[dev,export]' -c match/constraints-export.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSAWBLADE_BUILD_PYTHON=ON -DSAWBLADE_BUILD_TESTS=OFF \
            -DPython_EXECUTABLE=$PWD/match/.venv/bin/python \
            -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: A2 fixtures are reproducible
        run: match/.venv/bin/python tests/fixtures/a2/generate.py --check

      - name: pytest (export / A2 only)
        env:
          SAWBLADE_CORE_DIR: ${{ github.workspace }}/build/python
          SAWBLADE_TONERENDER: ${{ github.workspace }}/build/cli/tonerender
        run: match/.venv/bin/pytest match/tests/test_export.py match/tests/test_export_cancel.py match/tests/test_export_notes.py match/tests/test_export_plan.py match/tests/test_export_progress.py match/tests/test_a2_*.py match/tests/test_calibrate_device_null.py -rs

      - name: ccache stats
        if: always()
        run: ccache -s
