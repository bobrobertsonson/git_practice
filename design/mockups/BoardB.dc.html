<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction B: pedalboard and stack</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Barlow+Condensed:wght@600;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070707}
.kn{position:relative;border-radius:50%;background:repeating-conic-gradient(#1b1b1b 0 6deg,#3a3a3a 6deg 12deg);box-shadow:0 6px 9px rgba(0,0,0,.6)}
.kc{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 36% 28%,#9a9a9a 0,#3a3a3a 40%,#111 80%);box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.kp{position:absolute;inset:0}
.kp i{position:absolute;left:50%;top:10%;width:3px;height:30%;margin-left:-1.5px;border-radius:2px;background:#f4efe6}
.kl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em}
.lcd{background:linear-gradient(180deg,#160c02,#241303);color:#ffb347;font-family:'Share Tech Mono',monospace;font-size:12px;text-shadow:0 0 6px rgba(255,170,60,.6);border-radius:4px;padding:5px 8px;box-shadow:inset 0 2px 5px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#eee,#8a8a8a 60%,#444)}
.foot{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fafafa,#9c9c9c 55%,#5a5a5a);box-shadow:0 5px 0 #3a3a3a,0 8px 12px rgba(0,0,0,.6),inset 0 -3px 4px rgba(0,0,0,.3);border:none}
.led{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 15%,#ff3b2f 45%,#600 90%);box-shadow:0 0 10px #ff3b2f}
</style>
</helmet>
<div style="width:1200px;height:760px;box-sizing:border-box;padding:26px;background:linear-gradient(180deg,#1a1715 0%,#0d0c0b 55%,#0a0908 100%);font-family:'Barlow Condensed',sans-serif;display:flex;flex-direction:column;gap:22px;position:relative">

 <div style="display:flex;gap:20px;height:250px">
  <sc-for list="{{heads}}" as="h" hint-placeholder-count="2">
   <div style="flex:1;display:flex;flex-direction:column;border-radius:14px;padding:12px;background:repeating-linear-gradient(45deg,#121212 0 2px,#1b1b1b 2px 3px),#141414;box-shadow:0 18px 30px rgba(0,0,0,.7),inset 0 0 0 2px #3a3a3a">
    <div style="flex:1;position:relative;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;color:{{h.ink}};background:{{h.bg}};box-shadow:inset 0 2px 3px rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.4)">
     <span class="screw" style="left:6px;top:6px"></span><span class="screw" style="right:6px;top:6px"></span><span class="screw" style="left:6px;bottom:6px"></span><span class="screw" style="right:6px;bottom:6px"></span>
     <div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:28px;letter-spacing:.18em">{{h.name}}</span><span class="kl">{{h.sub}}</span></div>
     <div class="lcd">{{h.capture}}</div>
     <div style="display:flex;justify-content:space-between;margin-top:auto">
      <sc-for list="{{h.knobs}}" as="k" hint-placeholder-count="5">
       <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="kn" style="width:44px;height:44px"><div class="kc"></div><div class="kp" style="transform:rotate({{k.a}}deg)"><i></i></div></div><span class="kl">{{k.l}}</span></div>
      </sc-for>
     </div>
    </div>
   </div>
  </sc-for>
  <div style="width:250px;border-radius:12px;padding:12px;background:repeating-linear-gradient(45deg,#121212 0 2px,#1b1b1b 2px 3px),#141414;box-shadow:0 18px 30px rgba(0,0,0,.7),inset 0 0 0 2px #3a3a3a;display:flex;flex-direction:column;gap:8px">
   <div style="position:relative;flex:1;border-radius:6px;background:repeating-linear-gradient(0deg,#2b2a26 0 2px,#22211e 2px 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 18px rgba(0,0,0,.8);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px">
    <sc-for list="{{speakers}}" as="s" hint-placeholder-count="4"><div style="border-radius:50%;aspect-ratio:1;background:radial-gradient(circle,#1d1d1d 0 18%,#2e2e2e 19% 22%,#141414 23% 70%,#262626 71% 74%,#0f0f0f 75%);box-shadow:inset 0 0 10px #000"></div></sc-for>
    <div title="Mic position" style="position:absolute;left:58px;top:46px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ddd,#777);box-shadow:0 0 0 3px rgba(255,180,70,.6),0 4px 8px rgba(0,0,0,.8)"></div>
   </div>
   <div class="lcd">V30 MESA 4x12 · SM57 0.5in</div>
  </div>
 </div>

 <div style="position:relative;flex:1;border-radius:14px;padding:22px 26px;background:repeating-linear-gradient(0deg,#151515 0 18px,#0c0c0c 18px 22px),#121212;box-shadow:0 20px 40px rgba(0,0,0,.8),inset 0 0 0 3px #2a2a2a;display:flex;gap:24px">
  <svg width="1148" height="430" viewBox="0 0 1148 430" style="position:absolute;left:0;top:-170px;pointer-events:none" aria-hidden="true">
   <path d="M215 175 C 215 120, 230 90, 250 40" stroke="#1d1d1d" stroke-width="9" fill="none" stroke-linecap="round"></path>
   <path d="M215 175 C 215 120, 230 90, 250 40" stroke="{{sawColor}}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"></path>
   <path d="M215 395 C 520 360, 700 150, 700 40" stroke="#1d1d1d" stroke-width="9" fill="none" stroke-linecap="round"></path>
   <path d="M215 395 C 520 360, 700 150, 700 40" stroke="#5aa0e6" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"></path>
  </svg>
  <div style="flex:1;display:flex;flex-direction:column;gap:14px">
   <sc-for list="{{lanes}}" as="lane" hint-placeholder-count="2">
    <div style="display:flex;align-items:center;gap:16px;height:200px">
     <span style="writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;letter-spacing:.3em;color:{{lane.color}}">{{lane.name}}</span>
     <sc-for list="{{lane.pedals}}" as="p" hint-placeholder-count="1">
      <div style="position:relative;width:150px;height:196px;border-radius:12px;padding:12px 10px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;color:{{p.ink}};background:{{p.bg}};box-shadow:0 12px 18px rgba(0,0,0,.7),inset 0 2px 2px rgba(255,255,255,.3),inset 0 -4px 6px rgba(0,0,0,.4)">
       <div style="display:flex;gap:10px"><sc-for list="{{p.knobs}}" as="k" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div class="kn" style="width:34px;height:34px"><div class="kc"></div><div class="kp" style="transform:rotate({{k.a}}deg)"><i></i></div></div><span class="kl" style="font-size:9px">{{k.l}}</span></div></sc-for></div>
       <span class="led" style="opacity:{{p.ledOn}}"></span>
       <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:19px;letter-spacing:.12em;text-align:center;line-height:1">{{p.name}}</span>
       <span class="kl" style="font-size:9px;opacity:.85;text-align:center">{{p.capture}}</span>
       <button class="foot" aria-label="Bypass {{p.name}}" style="margin-top:auto"></button>
      </div>
     </sc-for>
     <button aria-label="Add pedal to {{lane.name}}" style="width:120px;height:196px;border-radius:12px;border:2px dashed #444;background:transparent;color:#8a8a8a;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.12em">+ ADD PEDAL</button>
    </div>
   </sc-for>
  </div>
  <div style="width:210px;border-radius:10px;padding:16px;box-sizing:border-box;background:linear-gradient(180deg,#2a2d31,#17191c);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 18px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;gap:12px;color:#e6e6e6">
   <span class="kl" style="font-size:13px">BLEND</span>
   <div style="position:relative;width:46px;height:220px;border-radius:8px;background:linear-gradient(180deg,#5aa0e6 0%,#0b0b0b 48%,#0b0b0b 52%,{{sawColor}} 100%);box-shadow:inset 0 2px 8px rgba(0,0,0,.9)">
    <div style="position:absolute;left:-10px;right:-10px;top:{{faderTop}}px;height:26px;border-radius:4px;background:linear-gradient(#f5f5f5,#9a9a9a);box-shadow:0 4px 8px rgba(0,0,0,.7);border-top:2px solid #fff"></div>
   </div>
   <div style="display:flex;justify-content:space-between;width:100%"><span class="kl" style="color:{{sawColor}}">SAW {{sawPct}}</span><span class="kl" style="color:#5aa0e6">BODY {{blend}}</span></div>
   <div class="lcd" style="width:100%;box-sizing:border-box;text-align:center">OUT −3.0 dB · 0 smp</div>
  </div>
 </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sawColor":{"editor":"color","options":["#e8641a","#c9361e","#e0a020"],"default":"#e8641a"},"blend":{"editor":"range","min":0,"max":100,"step":1,"default":55,"unit":"%"},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const saw = this.props.sawColor ?? '#e8641a';
    const blend = this.props.blend ?? 55;
    const ang = (p) => -135 + 270 * p;
    const ks = (arr) => arr.map(([l, p]) => ({ l, a: ang(p) }));
    const enamel = (c) => 'radial-gradient(circle at 30% 30%,rgba(255,255,255,.14) 0 1px,transparent 2px) 0 0/9px 9px,linear-gradient(160deg,' + c + ',#000 220%)';
    return {
      sawColor: saw, blend, sawPct: 100 - blend, faderTop: Math.round(4 + (190 * (100 - blend)) / 100),
      heads: [
        { name: 'SAW', sub: 'LOW/MED GAIN HEAD', capture: 'JCM800 2203 · CRUNCH', ink: '#fff6ea', bg: enamel(saw), knobs: ks([['GAIN', .55], ['LOW', .5], ['MID', .65], ['HIGH', .45], ['LEVEL', .5]]) },
        { name: 'BODY', sub: 'HIGH GAIN HEAD', capture: '5150III IVORY · RED', ink: '#e8ecf0', bg: 'linear-gradient(160deg,#454950,#22262b 60%,#15171a)', knobs: ks([['GAIN', .5], ['LOW', .45], ['MID', .5], ['HIGH', .5], ['LEVEL', .5]]) }
      ],
      speakers: [1, 2, 3, 4],
      lanes: [
        { name: 'SAW', color: saw, pedals: [{ name: 'CHAINSAW', capture: 'HM-2w · TONE3000 @ebheron', ink: '#fff6ea', bg: 'linear-gradient(160deg,#2a2a2a,#0e0e0e)', ledOn: 1, knobs: ks([['LOW', .95], ['HIGH', .95], ['DIST', .8]]) }] },
        { name: 'BODY', color: '#5aa0e6', pedals: [{ name: 'TIGHTEN', capture: 'TS808 JAPAN 03 · @v24x', ink: '#eaf6ff', bg: enamel('#2f6fa8'), ledOn: 1, knobs: ks([['DRIVE', .1], ['TONE', .55], ['LEVEL', .85]]) }] }
      ]
    };
  }
}
</script>
</body>
</html>
