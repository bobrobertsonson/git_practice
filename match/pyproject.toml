[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sawblade-match"
version = "0.1.0"
description = "Sawblade matching engine: TONE3000 client, capture cache, quality filter"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "soundfile==0.14.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "respx==0.23.1",
]
# Method 1 of sawblade-calibrate (stem separation). Weights are fetched at first use from dl.fbaipublicfiles.com.
separation = [
  "demucs==4.0.1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
]

[project.scripts]
sawblade-t3k = "sawblade_match.t3k.cli:main"
sawblade-tonecheck = "sawblade_match.tonecheck.cli:main"
sawblade-calibrate = "sawblade_match.calibrate.cli:main"
sawblade-match = "sawblade_match.matcher.cli:main"

[tool.setuptools.packages.find]
include = ["sawblade_match*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
